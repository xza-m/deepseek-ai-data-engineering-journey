name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Run local learning gates
        run: |
          aide environment --output artifacts/lab00/environment.json
          aide build-dataset --input data/sample/raw_documents.jsonl --output artifacts/lab01 --vocab-size 320 --sequence-length 64
          aide validate-dataset --output artifacts/lab01
