name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install --upgrade pip uv && uv sync --frozen --extra dev --extra train

      - name: Run full learning journey and quality gates
        run: make validate
