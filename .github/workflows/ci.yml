name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install --upgrade pip uv && uv sync --frozen --extra dev --extra train

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Run local learning gates
        run: |
          uv run aide environment --output artifacts/lab00/environment.json
          uv run aide build-dataset --input data/sample/raw_documents.jsonl --output artifacts/lab01 --vocab-size 320 --sequence-length 64
          uv run aide validate-dataset --output artifacts/lab01
          uv run aide train-tiny-lm --dataset artifacts/lab01 --output artifacts/lab02
          uv run aide validate-training-run --dataset artifacts/lab01 --output artifacts/lab02
