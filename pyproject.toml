[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "deepseek-ai-data-engineering-journey"
version = "0.1.0"
description = "从传统数据工程到 AI 数据工程的可复现学习项目"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "xza-m" }]
dependencies = [
  "tokenizers>=0.20,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
aide = "ai_data_engineering.cli:main"

[project.urls]
Repository = "https://github.com/xza-m/deepseek-ai-data-engineering-journey"
Issues = "https://github.com/xza-m/deepseek-ai-data-engineering-journey/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_data_engineering"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
